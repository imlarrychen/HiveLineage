# Run com.panfan.hivelineage.v2.cli.ScriptLineageCli with this configuration path.
lineage.scriptPath=src/test/resources/hql/generated/core_lineage_cases.sql
lineage.outputPath=target/lineage-v2/result.md
lineage.v2.jsonOutputPath=target/lineage-v2/result.json
lineage.workflowId=wf_local
lineage.taskId=core_lineage_cases
lineage.taskVersion=V1
lineage.clusterName=default
lineage.defaultDatabase=default
lineage.parseMode=TABLE_AND_COLUMN
lineage.includeTemporaryLineage=true
lineage.includeIgnoredStatements=false
lineage.expandViewLineage=true
lineage.parseJoinConditions=true
lineage.maxViewExpandDepth=5
lineage.failFast=false
lineage.fallbackVariableValue=__HIVE_LINEAGE_DEFAULT__
